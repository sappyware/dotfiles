# Gruvbox Dark — Muted Aqua

# Font
font_family Iosevka Nerd Font
bold_font auto
italic_font auto
font_size 17

# Window
background #282828
foreground #ebdbb2
selection_background #504945
selection_foreground #ebdbb2
cursor #83a598
cursor_text_color #282828
url_color #83a598

# Opacity and spacing
background_opacity 0.8
window_padding_width 15
confirm_os_window_close 0

# Borders
active_border_color #83a598
inactive_border_color #504945
bell_border_color #fb4934
visual_bell_color #d3869b
draw_minimal_borders yes

# Tabs
active_tab_background #83a598
active_tab_foreground #282828
inactive_tab_background #3c3836
inactive_tab_foreground #a89984
tab_bar_background #282828
tab_bar_style powerline
tab_powerline_style slanted

# Mouse and URLs
url_style curly
copy_on_select no
mouse_hide_wait 3.0

# Gruvbox Dark palette
color0  #282828
color8  #928374
color1  #cc241d
color9  #fb4934
color2  #98971a
color10 #b8bb26
color3  #d79921
color11 #fabd2f
color4  #458588
color12 #83a598
color5  #b16286
color13 #d3869b
color6  #689d6a
color14 #8ec07c
color7  #a89984
color15 #ebdbb2

# Scrollback
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes
