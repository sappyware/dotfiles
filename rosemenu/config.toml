[behavior]
mode = "daemon"

[colors]
bg = "#1d2021"
surface = "#282828"
border = "#3c3836"
fg = "#ebdbb2"
muted = "#928374"
accent = "#83a598"
selected_from = "#83a598"
selected_to = "#83a598"
selected_fg = "#1d2021"
hover = "#32302f"
urgent = "#fb4934"

[font]
family = "Iosevka NF"          # any installed font name; "" = system default
size = 20      # px
weight = "normal"         # thin|light|normal|medium|semibold|bold|extrabold|black, or 100..900
selected_weight = "semibold"   # weight of the highlighted row
italic = false
letter_spacing = 0

[window]
opacity = 1

[animation]
enabled = true
duration_ms = 250      # (0-2000)
resize_ms = 250


[search]
height       = 40
radius       = 10
border_width = 2
padding_x    = 12
placeholder  = "Search Apps..."
icon         = "\uf002"
icon_size    = 20
